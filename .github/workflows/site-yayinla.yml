# main'e her push'ta docs/ klasöründen aranabilir bir web sitesi üretir ve GitHub Pages'te yayınlar.
# İlk kurulum: Settings → Pages → Source: "Deploy from a branch" → Branch: gh-pages / (root)
name: Siteyi Yayınla

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: mkdocs gh-deploy --force
